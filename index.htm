<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17364c">
<title>北埔消防分隊｜職業安全衛生互動教材</title>
<style>
:root {
  --navy: #17364c;
  --blue: #24617a;
  --teal: #4e9a88;
  --bg: #f3f6f8;
  --card: #ffffff;
  --ink: #20313b;
  --muted: #647580;
  --line: #dbe3e8;
  --soft: #eaf2f5;
  --correct: #1e7e4e;
  --correct-bg: #eaf7ef;
  --wrong: #b8332a;
  --wrong-bg: #fdf0ef;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: rgba(36, 97, 122, 0.15);
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 980px;
  margin: auto;
  padding: 16px;
}

.hero {
  background: linear-gradient(130deg, var(--navy), var(--blue));
  color: white;
  padding: 28px 24px;
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(24, 57, 76, 0.12);
}

.tag {
  display: inline-block;
  border: 1px solid #a6cbd8;
  border-radius: 30px;
  padding: 4px 12px;
  font-size: 13px;
  letter-spacing: 0.5px;
}

.hero h1 {
  font-size: clamp(23px, 5.5vw, 36px);
  line-height: 1.3;
  margin: 12px 0 6px;
}

.substation {
  font-size: 15px;
  opacity: 0.95;
  font-weight: 500;
}

.hero p {
  margin: 10px 0 0;
  color: #e3f0f5;
  font-size: 14.5px;
  line-height: 1.65;
}

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 20px;
  margin-top: 14px;
  box-shadow: 0 2px 8px rgba(32, 49, 59, 0.04);
}

h2 { font-size: 21px; margin: 0 0 10px; color: var(--navy); }
h3 { font-size: 18px; margin: 0 0 8px; color: var(--navy); }
h4 { font-size: 16px; margin: 14px 0 6px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Sticky Navigation with Horizontal Scroll on Mobile */
.nav-wrap {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  padding: 8px 0 4px;
  margin: 8px 0;
}

.nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 4px 2px 6px;
}
.nav::-webkit-scrollbar {
  display: none;
}

button {
  font: inherit;
  cursor: pointer;
  border-radius: 12px;
  padding: 11px 16px;
  border: 1px solid var(--line);
  background: white;
  color: var(--ink);
  min-height: 46px;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

button:active {
  transform: scale(0.97);
}

button:focus-visible, input:focus-visible {
  outline: 3px solid #8fc4d7;
  outline-offset: 2px;
}

.nav button {
  flex: 0 0 auto;
  font-size: 14.5px;
  font-weight: 600;
  white-space: nowrap;
  border-radius: 999px;
  padding: 9px 18px;
  min-height: 42px;
}

.nav button.active, .primary {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
  font-weight: 700;
  box-shadow: 0 3px 10px rgba(36, 97, 122, 0.25);
}

.primary {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
  font-weight: 700;
}
.primary:hover {
  background: #1c5065;
}

.secondary {
  background: white;
}
.secondary:hover {
  background: #f8fafb;
}

.progress-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-weight: 700;
  font-size: 15px;
}

.bar {
  height: 9px;
  background: var(--line);
  border-radius: 9px;
  overflow: hidden;
  margin: 10px 0;
}
.bar > div {
  height: 100%;
  width: 0;
  background: var(--teal);
  transition: width 0.3s ease;
}

/* Home Grid & Clickable Modules */
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin: 16px 0;
}

.tile {
  padding: 16px;
  border-radius: 14px;
  background: var(--soft);
  border: 1.5px solid transparent;
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.tile.clickable {
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

.tile.clickable:hover {
  border-color: #9ac2d1;
  background: #e2edf2;
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(23, 54, 76, 0.08);
}

.tile.clickable:active {
  transform: scale(0.98);
  background: #d8e7ed;
}

.tile-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.num {
  font-size: 22px;
  font-weight: 850;
  color: var(--blue);
  line-height: 1;
}

.tile-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  background: #d6e8ef;
  color: var(--blue);
}

.tile.completed .tile-badge {
  background: #d4edda;
  color: #155724;
}

.tile-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 4px;
}

.tile-cta {
  margin-top: 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--blue);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Fully Touch-Optimized Option Cards */
.qopt {
  display: flex;
  gap: 13px;
  align-items: flex-start;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  margin: 10px 0;
  cursor: pointer;
  background: white;
  transition: all 0.15s ease;
  min-height: 52px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.qopt:hover {
  border-color: #a8c7d3;
  background: #fbfdfe;
}

.qopt:active {
  transform: scale(0.985);
  background: #edf6f9;
}

/* Selected state: Supports both CSS :has and JS .selected class for older/in-app mobile browsers */
.qopt:has(input:checked),
.qopt.selected {
  border-color: var(--blue) !important;
  background: #edf6fa !important;
  box-shadow: 0 0 0 1px var(--blue);
}

.qopt input[type="radio"],
.qopt input[type="checkbox"] {
  width: 22px;
  height: 22px;
  min-width: 22px;
  min-height: 22px;
  margin: 2px 0 0;
  accent-color: var(--blue);
  cursor: pointer;
}

.qopt-text {
  flex: 1;
  font-size: 15.5px;
  line-height: 1.55;
  color: var(--ink);
}

/* Quiz submitted states */
.qopt.quiz-correct {
  border-color: var(--correct) !important;
  background: var(--correct-bg) !important;
  box-shadow: 0 0 0 1px var(--correct);
}

.qopt.quiz-wrong {
  border-color: var(--wrong) !important;
  background: var(--wrong-bg) !important;
  box-shadow: 0 0 0 1px var(--wrong);
}

.qopt.quiz-answer-highlight {
  border-color: var(--correct) !important;
  border-style: dashed !important;
  background: #f3faf5 !important;
}

.feedback {
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--soft);
  margin-top: 12px;
  font-size: 14.5px;
  line-height: 1.65;
}

.feedback.correct {
  background: #eaf7ef;
  border: 1px solid #89d4a4;
  color: #14552b;
}

.feedback.warning {
  background: #fff8e6;
  border: 1px solid #fed276;
  color: #8c5b00;
}

.actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 24px;
}

.actions #prev {
  flex: 1;
  min-height: 48px;
  font-size: 15px;
}

.actions #next {
  flex: 2;
  min-height: 48px;
  font-size: 16px;
  font-weight: 700;
}

.w-full {
  width: 100%;
}

.btn-lg {
  min-height: 48px;
  font-size: 16px;
  font-weight: 700;
  padding: 12px 20px;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 24px 10px;
}

ul {
  padding-left: 20px;
}
li {
  margin: 6px 0;
}

@media (max-width: 600px) {
  .wrap {
    padding: 12px 10px;
  }
  .hero {
    padding: 22px 18px;
    border-radius: 15px;
  }
  .panel {
    padding: 15px 14px;
    border-radius: 12px;
  }
  .grid {
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .actions {
    flex-direction: row;
    gap: 10px;
  }
}

@media print {
  body { background: white; }
  .nav-wrap, .actions, button { display: none !important; }
  .panel, .hero { box-shadow: none; break-inside: avoid; }
  .wrap { max-width: none; padding: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="tag">消防職業安全衛生｜互動學習課程</span>
    <h1>安全出勤・平安歸來</h1>
    <div class="substation">新竹縣政府消防局第四大隊北埔分隊</div>
    <p>從廳舍環境、勤務壓力到救災現場風險，建立辨識危害、適當應變及主動通報的安全習慣。</p>
  </header>

  <section class="panel">
    <div class="progress-head">
      <span>學習進度</span>
      <span id="progress-label">已完成 0 / 5 個單元</span>
    </div>
    <div class="bar"><div id="progress"></div></div>
    <div class="small muted">建議學習時間：約 15–20 分鐘。完成各單元後，再進行課後測驗。</div>
  </section>

  <div class="nav-wrap" id="nav-wrap">
    <nav class="nav" id="nav" aria-label="教材單元">
      <button class="active" data-tab="0">課程首頁</button>
      <button data-tab="1">環境品質</button>
      <button data-tab="2">壓力管理</button>
      <button data-tab="3">危害辨識</button>
      <button data-tab="4">安全衛生教育</button>
      <button data-tab="5">健康管理</button>
      <button data-tab="6">課後測驗</button>
    </nav>
  </div>

  <main id="content" aria-live="polite"></main>

  <section class="panel small muted">
    <strong>教材使用提醒</strong><br>
    本教材為教育訓練用途，依提供之北埔分隊職安訪視文章編製。實際作業應遵循消防局規定、現場指揮及適用的職業安全衛生規範；教材內容不取代正式程序、專業評估或緊急醫療處置。
  </section>

  <footer>北埔消防分隊職業安全衛生互動教材｜安全出勤・平安歸來</footer>
</div>

<script>
(function(){
  const content = document.getElementById('content');
  const navWrap = document.getElementById('nav-wrap');
  const navButtons = [...document.querySelectorAll('#nav [data-tab]')];
  const completed = new Set();
  let answers = {};
  let submitted = false;

  const modules = [
    {
      title: '課程首頁',
      body: '' // Rendered dynamically by getHomeHtml()
    },
    {
      title: '單元一｜環境品質',
      body: `
        <h2>打造安全、舒適的備勤環境</h2>
        <p>工作安全環境需要持續檢查及改善。本單元聚焦空氣品質、噪音、照明及通風。</p>
        <div class="panel">
          <h3>空氣品質</h3>
          <ul>
            <li>留意異味、煙霧、粉塵及可能的廢氣來源。</li>
            <li>依規定維持空間清潔與適當通風。</li>
            <li>如懷疑一氧化碳或其他有害氣體，應立即撤離危險區域、通報並由合適人員檢測，不可只依氣味判斷。</li>
          </ul>
        </div>
        <div class="panel">
          <h3>噪音與照明</h3>
          <ul>
            <li>注意警報器、機械設備或其他持續性噪音對休息及溝通的影響。</li>
            <li>確認走道、樓梯、器材區及作業位置照明足夠。</li>
            <li>發現燈具損壞、眩光或視線死角時，應反映修復或調整。</li>
          </ul>
        </div>
        <div class="panel">
          <h3>通風與整潔</h3>
          <ul>
            <li>勿任意阻擋通風口或逃生動線。</li>
            <li>保持地面乾燥，清除障礙物並妥善收納器材。</li>
            <li>污染裝備及清潔用品依規範分區處理、存放。</li>
          </ul>
        </div>
        <h3>情境練習</h3>
        <p>你發現器材區地面積水，旁邊又有電器延長線。下列哪個作法較恰當？</p>
        <div id="scene-options">
          <label class="qopt" for="scene-a">
            <input type="radio" id="scene-a" name="scene" value="a">
            <span class="qopt-text">直接踩過去清理並拔插頭。</span>
          </label>
          <label class="qopt" for="scene-b">
            <input type="radio" id="scene-b" name="scene" value="b">
            <span class="qopt-text">避免接近危險區，通報並依安全程序處理電氣及積水風險。</span>
          </label>
          <label class="qopt" for="scene-c">
            <input type="radio" id="scene-c" name="scene" value="c">
            <span class="qopt-text">先拍照，等下班再反映。</span>
          </label>
        </div>
        <button class="primary btn-lg w-full" id="scene-check" style="margin-top:12px;">確認答案</button>
        <div id="scene-feedback"></div>
      `
    },
    {
      title: '單元二｜壓力管理',
      body: `
        <h2>四大勤務壓力管理因子</h2>
        <p>訪視文章提出勤務時間、突發任務、睡眠問題及情緒支持四大因子。壓力管理是個人、同儕與組織共同的責任。</p>
        <div class="panel">
          <h3>勤務時間</h3>
          <ul>
            <li>合理安排勤務與工作分配，依規定落實休息及交接。</li>
            <li>若工作負荷持續偏高，應向主管反映並討論可行的調整方式。</li>
          </ul>
        </div>
        <div class="panel">
          <h3>突發任務</h3>
          <ul>
            <li>出勤前掌握已知資訊、任務分工及安全提醒。</li>
            <li>任務中保持通訊與情勢回報；情勢改變時重新評估風險。</li>
          </ul>
        </div>
        <div class="panel">
          <h3>睡眠問題</h3>
          <ul>
            <li>在勤務允許下爭取休息，維持適當的睡眠習慣。</li>
            <li>若疲勞已影響警覺、判斷或操作，應立即告知主管並評估安全替代安排。</li>
          </ul>
        </div>
        <div class="panel">
          <h3>情緒支持</h3>
          <ul>
            <li>同仁之間主動關心，尊重個人意願與隱私。</li>
            <li>重大或高壓事件後，可依需要尋求主管、專業心理支持或員工協助資源。</li>
            <li>持續的情緒困擾不必獨自承擔，及早尋求協助。</li>
          </ul>
        </div>
        <h3>情境判斷</h3>
        <p>同仁在連續勤務後明顯疲勞，卻擔心提出來會被認為不夠積極。你會怎麼做？</p>
        <div id="pressure-options">
          <label class="qopt" for="pressure-a">
            <input type="radio" id="pressure-a" name="pressure" value="a">

          </label>
          <label class="qopt" for="pressure-b">
            <input type="radio" id="pressure-b" name="pressure" value="b">

          <label class="qopt" for="pressure-c">

            <span class="qopt-text">直接在群組公開討論他的身心狀況。</span>
          </label>
        </div>
        <button class="primary btn-lg w-full" id="pressure-check" style="margin-top:12px;">確認答案</button>
        <div id="pressure-feedback"></div>
      `
    },
    {
      title: '單元三｜潛在危害辨識',
      body: `
        <h2>風險辨識四步驟</h2>
        <div class="panel">
          <h3>第一步：發現危害</h3>
          <p>觀察現場環境、設備、動線、個人狀態及可能的暴露來源。</p>
        </div>
        <div class="panel">
          <h3>第二步：評估風險</h3>

        <div class="panel">
          <h3>第四步：通報及追蹤</h3>

        </div>
        <h3>常見風險檢查表</h3>

          </label>
          <label class="qopt" for="chk-4">
            <input type="checkbox" id="chk-4">
            <span class="qopt-text">人員了解作業風險、通訊方式及必要防護。</span>
          </label>
          <label class="qopt" for="chk-5">
            <input type="checkbox" id="chk-5">
            <span class="qopt-text">發現的缺失已通報並安排追蹤。</span>
          </label>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
          <span id="check-count" class="small muted" style="font-weight:600;">已確認 0 / 5 項</span>
          <button class="secondary" id="check-reset" style="padding:6px 14px;min-height:38px;font-size:13px;">重設勾選</button>
        </div>
        <div class="feedback" style="margin-top:14px;">
          <strong>注意：</strong>救災現場應持續進行動態風險評估。若出現立即危險，應依現場指揮及安全程序採取保護措施，不可為完成檢查而延誤撤離或求援。
        </div>
      `
    },

  function updateProgress(){

      label.textContent = '已完成 5 / 5 個單元（可進行課後測驗 🎉）';

      label.style.color = '';
    }

  function showTab(n){
    navButtons.forEach((b, i) => b.classList.toggle('active', i === n));

    if (n === 6) {
      showQuiz();

    }

    if (n === 0) {
      content.innerHTML = getHomeHtml();

    actions.className = 'actions';

      <button class="secondary" id="prev" ${n === 0 ? 'style="visibility:hidden;"' : ''}>← 上一單元</button>
      <button class="primary" id="next">${n === 5 ? '前往課後測驗 →' : n === 0 ? '開始第一單元 →' : '下一單元 →'}</button>

    actions.querySelector('#prev').onclick = () => {
      showTab(Math.max(0, n - 1));
      window.scrollTo({ top: navWrap.offsetTop - 8, behavior: 'smooth' });

    actions.querySelector('#next').onclick = () => {
      if (n > 0 && n < 6) mark(n);

  content.addEventListener('click', (e) => {
    const tile = e.target.closest('[data-nav]');
    if (tile) {
      const tabIndex = Number(tile.dataset.nav);
      showTab(tabIndex);
      window.scrollTo({ top: navWrap.offsetTop - 8, behavior: 'smooth' });
    }
  });

  content.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      const tile = e.target.closest('[data-nav]');
      if (tile) {
        e.preventDefault();
        showTab(Number(tile.dataset.nav));
        window.scrollTo({ top: navWrap.offsetTop - 8, behavior: 'smooth' });
      }
    }
  });

  // Global Change Event Delegation for Robust Touch Highlighting
  document.addEventListener('change', (e) => {
    const input = e.target;
    if (!input || !input.matches('input[type="radio"], input[type="checkbox"]')) return;

    if (input.type === 'radio') {
      const name = input.name;
      document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
        r.closest('.qopt')?.classList.toggle('selected', r.checked);
      });
    } else if (input.type === 'checkbox') {
      input.closest('.qopt')?.classList.toggle('selected', input.checked);
    }
  });

  // Tap handler to guarantee immediate touch selection feedback
  document.addEventListener('click', (e) => {
    const qopt = e.target.closest('.qopt');
    if (!qopt) return;
    const input = qopt.querySelector('input');
    if (!input || input.disabled) return;

    setTimeout(() => {
      if (input.type === 'radio') {
        document.querySelectorAll(`input[name="${input.name}"]`).forEach(r => {
          r.closest('.qopt')?.classList.toggle('selected', r.checked);
        });
      } else {
        qopt.classList.toggle('selected', input.checked);
      }
    }, 10);
  });

  // Nav Tab Buttons
  navButtons.forEach(b => {
    b.addEventListener('click', () => {
      showTab(Number(b.dataset.tab));
      window.scrollTo({ top: navWrap.offsetTop - 8, behavior: 'smooth' });
    });
  });

  // Initial Load
  showTab(0);
})();
</script>
</body>
</html>
